  verified: 2026-11-19
  verify: []

- id: meta-amrize-concrete
  name: AI-optimized low-carbon concrete mix (Rosemount, MN)
  orgs: [meta, amrize]
  material_class: cement-concrete
  application: Structural concrete for a data center
  what_is_new: Recipe of a known material class tuned by AI and poured at scale; the only AI-made material both published and deployed
  key_property:
    name: Early strength gain and embodied carbon
    value: Reached 4,000 psi 43% faster; embodied carbon 35% lower; drying shrinkage 9.5% lower; similar cost
