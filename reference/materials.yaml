    basis: internal-baseline
    gap: 43% faster strength gain vs the original formula; 35% lower carbon vs the regional average
    tradeoffs: Long-term durability still under test at UIUC
  ai_role: Bayesian optimization of the mix recipe (BOxCrete, open model on 500+ strength measurements from 123 mixes)
  evidence: preprint
  stage: deployed
  publication: {id: "arXiv:2603.21525", url: "https://arxiv.org/abs/2603.21525", title: "BOxCrete: A Bayesian Optimization Open-Source AI Model for Concrete Strength Forecasting and Mix Optimization", date: 2026}
