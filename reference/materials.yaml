# Material registry: one entry per material. The material is the unit; organizations are secondary (orgs.yaml).
# Seeded 2026-11-19 from the Tools Companies vault screen (wiki/analyses/2026-11-19-ai-materials-screen.md)
# and the benchmark pass the same day.
#
# Enums (tracker/registry.py enforces them):
#   evidence: peer-reviewed | preprint | company-reported | claim
#   stage:    deployed (sold or in use in a product or structure) | customer-tested (samples, pilots, scale-up partner, license) | lab
#   benchmark.basis:
#     head-to-head      same test, same lab, against the field's best or the commercial incumbent
#     literature        material's value vs a best-in-class value from a different study
#     internal-baseline vs the starting recipe or the authors' own control, not the field's best
#     design-target     vs the property the model was asked to hit
#     none-stated       no quantitative comparison found; a finding, not a gap to paper over
#     not-applicable    bulk discovery result, not a single material
# `verify` lists fields still to confirm against a primary source; LAUNCH_GATE=1 tests fail while any remain.

materials:

# ---------------------------------------------------------------- Verified: published, real material
- id: lila-inmnpdox
  name: InMnPdOx anode catalyst
  orgs: [lila-sciences]
  material_class: catalyst
  application: Acidic oxygen evolution (PEM water electrolyzer anode)
  what_is_new: Iridium- and ruthenium-free oxide that survives acid; palladium had been considered a dead end for acidic OER
  key_property:
    name: Overpotential at 10 mA/cm2 in 1 M H2SO4
    value: 0.45 V (not iR-corrected); stayed below 0.5 V over 1,000 h. PdOx failed at ~200 h, NiTaPdOx at ~470 h
    source: https://arxiv.org/abs/2609.30133
  benchmark:
    material: RuOx on the same platform
    value: 0.41 V at 10 mA/cm2 (not iR-corrected); RuOx kept 59% of its Ru after 661 h vs 96% Pd for InMnPdOx after 1,000 h
    source: https://arxiv.org/abs/2609.30133
    basis: head-to-head
    gap: 40 mV more overpotential than RuOx, with no Ru or Ir and far better metal retention
    tradeoffs: Palladium is itself a platinum-group metal; humans moved samples between tools
  ai_role: AI-guided, human-supervised closed loop (>90% automated); 2,942 catalysts across 53 systems and 26 elements
  evidence: preprint
  stage: lab
  publication: {id: "arXiv:2609.30133", url: "https://arxiv.org/abs/2609.30133", title: "AI-guided high-throughput discovery of iridium- and ruthenium-free palladium-oxide catalysts for durable acidic oxygen evolution", date: 2026-09-24}
  sources: ["https://cen.acs.org/business/start-ups/lila-ai-hydrogen-catalyst-electrolyzer/104/web/2026/10"]
  verified: 2026-11-19
  verify: []

