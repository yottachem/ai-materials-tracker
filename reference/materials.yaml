  evidence: peer-reviewed
  stage: lab
  publication: {id: "doi:10.1016/j.checat.2023.100888", url: "https://doi.org/10.1016/j.checat.2023.100888", title: "Accelerated exploration of heterogeneous CO2 hydrogenation catalysts by Bayesian-optimized high-throughput and automated experimentation", date: 2024}
