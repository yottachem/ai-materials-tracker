- id: pnnl-naxli3-xycl6
  name: NaxLi3-xYCl6 solid electrolyte series
  orgs: [microsoft, pnnl]
  material_class: electrolyte
  application: Solid-state lithium battery electrolyte
  what_is_new: Mixed sodium-lithium chloride electrolyte found by screening 32.6M candidates down to 18; Na2LiYCl6 uses one lithium per formula unit instead of three
  key_property:
    name: Ionic conductivity
    value: Na2LiYCl6 2.2e-6 S/cm at 100 C (vs 6.0e-8 S/cm for parent Na3YCl6)
    source: https://arxiv.org/abs/2401.04070
  benchmark:
    material: Li3YCl6 (lithium-only chloride electrolyte)
    value: 0.2-1.0 mS/cm at room temperature (ball-milled, hot-pressed samples)
    source: https://www.osti.gov/pages/biblio/17067935-structure-li3ycl6-its-effect-lithium-ionic-conductivity
    basis: literature
    gap: Roughly 100-500x lower conductivity than Li3YCl6, even measured at 100 C against room temperature
    tradeoffs: Less lithium at a large conductivity cost; samples were mixed-phase. The "70% less lithium" figure is Microsoft's framing, not in the paper
  ai_role: ML + cloud HPC screening, 32.6M candidates to 18
  evidence: peer-reviewed
  stage: lab
  publication: {id: "doi:10.1021/jacs.4c03849", url: "https://doi.org/10.1021/jacs.4c03849", title: "Accelerating Computational Materials Discovery with Machine Learning and Cloud High-Performance Computing: from Large-Scale Screening to Experimental Validation", date: 2024-07-09}
  sources: ["https://www.pnnl.gov/publications/accelerating-computational-materials-discovery-machine-learning-and-cloud-high"]
  verified: 2026-11-19
  verify: []

