# Signal config per organization: what the weekly ingest fetches. Keys are org ids from orgs.yaml.
# Kept apart from orgs.yaml so the hand-curated registry carries no fetch settings.
#
# domains        org-owned web domains; a source on these counts as tier 1 (company announcement)
# news           terms: exact phrases, every term fully quoted ('"Lila Sciences"'); a headline needs every phrase of one term.
#                context: when present, one of these words must also appear (title or summary). exclude: same-name orgs.
# newsroom_feed  the org's own RSS/Atom feed (primary source; news-term filter skipped)
# cik            SEC filer id (Form D for private companies; 8-K/10-K for public)
# openalex       institutions: OpenAlex institution ids (big institutions also need `query`)
#                affiliations: phrases matched in the raw affiliation text (startups without an institution id)
#                require: one of these must also appear in the matched affiliation text (same-name collisions)
#                authors: OpenAlex author ids (named groups inside big institutions)
#                query: title-and-abstract search applied to this org's works (default: none for startups and authors)
# verify         fields still to confirm
# Checked 2026-11-19: domains by fetch, CIKs by EDGAR search + submissions record, OpenAlex ids by API.

signals:

# ---------------------------------------------------------------- Organizations with a material
  lila-sciences:
    domains: [lila.ai]
    news: {terms: ['"Lila Sciences"']}
    openalex: {affiliations: ["Lila Sciences"]}
