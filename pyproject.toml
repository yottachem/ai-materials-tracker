[project]
name = "ai-materials-tracker"
version = "0.1.0"
description = "AI-Made Materials: Proof Tracker. Real materials made with AI/ML, graded on published proof and compared with the existing best"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
